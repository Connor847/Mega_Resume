# Example master resume for a fictional person. Copy this file OUTSIDE the repo
# (or into my/, which is git-ignored), replace the content with yours, then lock it:
#   chmod a-w path/to/master.yaml
#
# Rules: every bullet has a unique id and is used verbatim. Tags are optional hints.
# priority: must  -> the bullet (or entry) is required in every resume.

style:                     # optional; these are the defaults
  font: Times New Roman
  body_size: 10
  page_limit: 1

